# One stack on the VPS, read by `deploy/remote-deploy.sh` from its folder:
# /opt/dar-el-barka for production, /opt/dar-el-barka-staging for staging
# (issue 017). Values come from `.env` (image tag, port, registry owner,
# stack name) and the API's configuration from `backend.env`, both written
# by the deploy from the secrets of the GitHub environment. Postgres is not
# part of this stack: the API joins the database's own network,
# `pg-network`, and the database keeps accepting internal connections only.
#
# Two stacks live side by side: the folder gives each its compose project
# (its own `app` network and its own media volume) and `STACK_NAME` its
# container names, `deb-*` for production, `deb-staging-*` for staging.
services:
  backend:
    image: ghcr.io/${REGISTRY_OWNER}/dar-el-barka-backend:${IMAGE_TAG}
    container_name: ${STACK_NAME:-deb}-backend
    restart: unless-stopped
    init: true
    env_file: backend.env
    environment:
      GIT_SHA: ${IMAGE_TAG}
      MEDIA_ROOT: /data/media
    # Product photos (issue #64) live in a named volume, so a redeploy that
    # replaces the containers keeps them; nginx serves the same folder.
    volumes:
      - deb-media:/data/media
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4000/api/health/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - app
      - pg-network

  # One-off: `docker compose run --rm migrate` applies the pending additive
  # migrations before the new API starts.
  migrate:
    image: ghcr.io/${REGISTRY_OWNER}/dar-el-barka-backend:${IMAGE_TAG}
    profiles:
      - migrate
    env_file: backend.env
    command: ["npm", "run", "prisma:migrate:deploy"]
    networks:
      - pg-network

  frontend:
    image: ghcr.io/${REGISTRY_OWNER}/dar-el-barka-frontend:${IMAGE_TAG}
    container_name: ${STACK_NAME:-deb}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Reached through the VPS nginx, which terminates TLS for the domain and
    # forwards to this port on the loopback; nothing listens on the public
    # interface any more.
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-8081}:80"
    volumes:
      - deb-media:/usr/share/nginx/media:ro
    networks:
      - app

volumes:
  deb-media: {}

networks:
  app: {}
  pg-network:
    external: true
