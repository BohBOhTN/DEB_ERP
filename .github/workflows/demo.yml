name: Demo rehearsal

# The stakeholder demo against the real API (UI-24, UI-25, AS-V2-23), run on
# demand only: the owner decided on 2026-09-24 to show the demo manually and
# to come back to this replay after the features are complete, so it never
# blocks a pull request. Start it from the Actions tab.
on:
  workflow_dispatch:

env:
  CI_DATABASE_URL: postgresql://ci:ci@localhost:5432/dar_el_barka_ci?schema=public

jobs:
  demo:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dar_el_barka_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dar_el_barka_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Spelled out: a job-level env block cannot read the env context, and a
      # workflow with that reference is invalid, which shows as a failed run
      # on every push although the workflow only starts by hand.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dar_el_barka_ci?schema=public
      NODE_ENV: development
      PORT: "4000"
      LOG_LEVEL: warn
      API_URL: http://localhost:4000
      API_PROXY_TARGET: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client and migrate
        run: |
          npm run prisma:generate
          npm run prisma:migrate:deploy --workspace backend

      - name: Seed the demo dataset
        run: npm run demo:seed -- --size small

      - name: Build
        run: npm run build

      - name: Start the API
        run: |
          node backend/dist/server.js > backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/v1/health/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Demo rehearsal in the browser
        run: npm run e2e:seeded --workspace frontend
        env:
          CI: "1"

      - name: Lighthouse on the served build
        run: |
          npm run preview --workspace frontend -- --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run lighthouse --workspace frontend
        env:
          APP_URL: http://localhost:4173

      - name: Upload demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-evidence
          path: |
            frontend/playwright-report-seeded
            backend.log
          retention-days: 7
