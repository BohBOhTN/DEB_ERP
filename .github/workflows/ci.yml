name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - dev
  # A deploy by hand: the current commit of the chosen branch, or an image
  # built earlier when `image_tag` names its commit (a rollback), to the
  # stack chosen. Staging is the default so a slip never reaches production.
  workflow_dispatch:
    inputs:
      target:
        description: "Stack to deploy to"
        type: choice
        options:
          - staging
          - production
        default: staging
      image_tag:
        description: "Commit SHA of an image already in GHCR to redeploy; empty builds this commit"
        required: false
        default: ""

env:
  # Throwaway database for CI only. It is created fresh for every run and is
  # never the shared remote development database.
  CI_DATABASE_URL: postgresql://ci:ci@localhost:5432/dar_el_barka_ci?schema=public

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dar_el_barka_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dar_el_barka_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Apply migrations to the CI database
        run: npm run prisma:migrate:deploy --workspace backend
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      # The migrated database must match prisma/schema.prisma, except for the
      # partial indexes and sequences Prisma cannot express (listed in
      # backend/prisma/protected-objects.json). Anything else is drift that
      # the next `prisma migrate dev` would turn into a destructive migration.
      - name: Check schema drift
        run: npm run db:check-drift --workspace backend
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      # The committed contract must match the route catalogue, and the
      # frontend types must match the contract, so a route change that was not
      # regenerated into both files fails here rather than at integration time.
      - name: Check the OpenAPI document
        run: npm run openapi:check --workspace backend

      - name: Check the generated API types
        run: |
          npm run api:types --workspace frontend
          git diff --exit-code -- frontend/src/lib/api/types.gen.ts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          # Runs the database-backed concurrency suites. REQUIRE_INTEGRATION_TESTS
          # makes a missing database fail the build rather than silently skip
          # the test that proves one order cannot become two sales.
          INTEGRATION_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          REQUIRE_INTEGRATION_TESTS: "1"

      # The performance suite seeds a large history and runs alone, verbosely,
      # so a failure or a crash in it is reported on its own rather than
      # taking the unit-test run down with it.
      - name: Performance integration suite
        run: npm run test:integration --workspace backend
        env:
          INTEGRATION_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          REQUIRE_INTEGRATION_TESTS: "1"

      - name: Build
        run: npm run build

      # The shell smoke drives the Vite dev server in a headless Chromium with
      # the API mocked in the browser, at 360 px and 1280 px.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: npm run e2e --workspace frontend
        env:
          CI: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Every pull request proves both images still build; nothing is pushed.
  containers:
    name: Container images
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Which stack a run deploys (issue 017): a push to `main` goes to
  # production, a push to `staging` to the staging stack, a run by hand to
  # the target chosen. Each stack has its folder and its container names on
  # the VPS, and its own GitHub environment for the secrets.
  target:
    name: Deploy target
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
      stack_dir: ${{ steps.pick.outputs.stack_dir }}
      stack_name: ${{ steps.pick.outputs.stack_name }}
      channel: ${{ steps.pick.outputs.channel }}
    steps:
      - name: Pick the stack
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CHOSEN: ${{ github.event.inputs.target }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            name="$CHOSEN"
          elif [ "$REF" = "refs/heads/main" ]; then
            name=production
          else
            name=staging
          fi
          case "$name" in
            production)
              stack_dir=/opt/dar-el-barka
              stack_name=deb
              channel=latest
              ;;
            staging)
              stack_dir=/opt/dar-el-barka-staging
              stack_name=deb-staging
              channel=staging
              ;;
            *)
              echo "Unknown deploy target: $name" >&2
              exit 1
              ;;
          esac
          {
            echo "name=$name"
            echo "stack_dir=$stack_dir"
            echo "stack_name=$stack_name"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

  # Ships a build to the VPS (issues 010 and 017): after `quality`, to the
  # stack `target` picked. Production waits for its environment's reviewer;
  # staging deploys as soon as the checks are green.
  deploy:
    name: Deploy to the VPS
    needs: [quality, target]
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.name }}
    concurrency:
      group: ${{ needs.target.outputs.name }}-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag != '' && github.event.inputs.image_tag || github.sha }}
      STACK_DIR: ${{ needs.target.outputs.stack_dir }}
      STACK_NAME: ${{ needs.target.outputs.stack_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Registry owner
        id: prep
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event.inputs.image_tag == ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push the backend image
        if: github.event.inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/dar-el-barka-backend:${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.owner }}/dar-el-barka-backend:${{ needs.target.outputs.channel }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push the frontend image
        if: github.event.inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/dar-el-barka-frontend:${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.owner }}/dar-el-barka-frontend:${{ needs.target.outputs.channel }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Copy the stack files to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/remote-deploy.sh,deploy/refresh-staging-db.sh"
          target: ${{ needs.target.outputs.stack_dir }}
          strip_components: 1

      - name: Run the deploy on the VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY_OWNER: ${{ steps.prep.outputs.owner }}
          PUBLIC_PORT: ${{ secrets.PUBLIC_PORT }}
          PUBLIC_BIND: ${{ secrets.PUBLIC_BIND }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: IMAGE_TAG,STACK_DIR,STACK_NAME,REGISTRY_OWNER,PUBLIC_PORT,PUBLIC_BIND,GHCR_USER,GHCR_TOKEN,BACKEND_ENV
          script: |
            set -e
            chmod +x "$STACK_DIR/remote-deploy.sh"
            "$STACK_DIR/remote-deploy.sh"

      - name: Smoke the public endpoint
        run: |
          set -e
          for attempt in $(seq 1 12); do
            body="$(curl -fsS "${{ secrets.PUBLIC_URL }}/api/health/ready" || true)"
            if echo "$body" | grep -q "\"gitSha\":\"${IMAGE_TAG}\""; then
              echo "Ready: $body"
              exit 0
            fi
            sleep 5
          done
          echo "The public endpoint never reported ${IMAGE_TAG}: $body" >&2
          exit 1
