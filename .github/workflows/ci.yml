name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

env:
  # Throwaway database for CI only. It is created fresh for every run and is
  # never the shared remote development database.
  CI_DATABASE_URL: postgresql://ci:ci@localhost:5432/dar_el_barka_ci?schema=public

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dar_el_barka_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dar_el_barka_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Apply migrations to the CI database
        run: npm run prisma:migrate:deploy --workspace backend
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      # The migrated database must match prisma/schema.prisma, except for the
      # partial indexes and sequences Prisma cannot express (listed in
      # backend/prisma/protected-objects.json). Anything else is drift that
      # the next `prisma migrate dev` would turn into a destructive migration.
      - name: Check schema drift
        run: npm run db:check-drift --workspace backend
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      # The committed contract must match the route catalogue, and the
      # frontend types must match the contract, so a route change that was not
      # regenerated into both files fails here rather than at integration time.
      - name: Check the OpenAPI document
        run: npm run openapi:check --workspace backend

      - name: Check the generated API types
        run: |
          npm run api:types --workspace frontend
          git diff --exit-code -- frontend/src/lib/api/types.gen.ts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          # Runs the database-backed concurrency suites. REQUIRE_INTEGRATION_TESTS
          # makes a missing database fail the build rather than silently skip
          # the test that proves one order cannot become two sales.
          INTEGRATION_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          REQUIRE_INTEGRATION_TESTS: "1"

      # The performance suite seeds a large history and runs alone, verbosely,
      # so a failure or a crash in it is reported on its own rather than
      # taking the unit-test run down with it.
      - name: Performance integration suite
        run: npm run test:integration --workspace backend
        env:
          INTEGRATION_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          REQUIRE_INTEGRATION_TESTS: "1"

      - name: Build
        run: npm run build

      # The shell smoke drives the Vite dev server in a headless Chromium with
      # the API mocked in the browser, at 360 px and 1280 px.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: npm run e2e --workspace frontend
        env:
          CI: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # The stakeholder demo against the real API (UI-24, UI-25, AS-V2-23): the
  # backend runs on a fresh CI database filled by the demo seed, the demo
  # script is replayed in a browser at the presenter's phone and laptop
  # widths, then Lighthouse scores the served build on the phone profile.
  demo:
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dar_el_barka_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dar_el_barka_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The env context is not available at job level: the same throwaway
      # database as the quality job, spelled out.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dar_el_barka_ci?schema=public
      NODE_ENV: development
      PORT: "4000"
      LOG_LEVEL: warn
      API_URL: http://localhost:4000
      API_PROXY_TARGET: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client and migrate
        run: |
          npm run prisma:generate
          npm run prisma:migrate:deploy --workspace backend

      - name: Seed the demo dataset
        run: npm run demo:seed -- --size small

      - name: Build
        run: npm run build

      - name: Start the API
        run: |
          node backend/dist/server.js > backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/v1/health/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Demo rehearsal in the browser
        run: npm run e2e:seeded --workspace frontend
        env:
          CI: "1"

      - name: Lighthouse on the served build
        run: |
          npm run preview --workspace frontend -- --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run lighthouse --workspace frontend
        env:
          APP_URL: http://localhost:4173

      - name: Upload demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-evidence
          path: |
            frontend/playwright-report-seeded
            backend.log
          retention-days: 7
